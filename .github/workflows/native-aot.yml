name: Native AOT

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-aot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  publish:
    name: Publish and run (win-x64)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Linde.csproj --runtime win-x64

      - name: Publish
        run: dotnet publish Linde.csproj --configuration Release --runtime win-x64 --no-restore --output artifacts/publish

      - name: Run native smoke test
        shell: pwsh
        run: ./artifacts/publish/linde.exe
